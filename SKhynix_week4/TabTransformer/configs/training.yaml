training:
  batch_size: 1024
  learning_rate: 0.001
  num_epochs: 1
  weight_decay: 0.01
  scheduler: "ReduceLROnPlateau"
  scheduler_patience: 10
  early_stopping_patience: 20
  
validation:
  metric: "mae"  # primary metric for early stopping
  
evaluation:
  metrics: ["mae", "mape"]  # evaluation metrics to report
  
logging:
  log_interval: 10
  save_model_every: 20