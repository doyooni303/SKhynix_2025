# ========================================
# 학습 하이퍼파라미터
# ========================================

# 에폭 수 - 전체 데이터셋을 몇 번 반복 학습할지
# 20: 충분한 학습을 위한 에폭 수
num_epochs: 10

# 학습률 - 가중치 업데이트 크기
# 0.0001: 안정적인 학습을 위한 표준 학습률
learning_rate: 0.0001

# 조기 종료 인내도 - 성능 개선이 없을 때 몇 에폭을 더 기다릴지
# 20: 20 에폭 동안 개선이 없으면 학습 중단
patience: 5

# ========================================
# 옵티마이저 설정
# ========================================

# 옵티마이저 종류 - 가중치 업데이트 알고리즘
# "adamw": Adam with Weight Decay (가중치 감쇠가 포함된 Adam)
optimizer: "adamw"

# 가중치 감쇠 - L2 정규화 강도
# 0.01: 과적합 방지를 위한 정규화
weight_decay: 0.01

# ========================================
# 학습률 스케줄러 설정
# ========================================

# 스케줄러 종류 - 학습률 조정 방법
# "reduce_on_plateau": 검증 손실이 개선되지 않으면 학습률 감소
scheduler: "reduce_on_plateau"

# 학습률 감소 비율 - 학습률을 얼마나 줄일지
# 0.5: 기존 학습률의 50%로 감소
scheduler_factor: 0.5

# 스케줄러 인내도 - 몇 에폭 동안 개선이 없으면 학습률을 줄일지
# 10: 10 에폭 동안 개선이 없으면 학습률 감소
scheduler_patience: 5

# ========================================
# 평가 설정
# ========================================

# 평가 방식 - 모델 출력을 어떻게 평가할지
# "target": 참조 위치(ref_idx)의 예측값만 평가
# 옵션: "target" (단일 위치), "sequence" (전체 시퀀스 평균)
evaluation_setting: "target"

# ========================================
# 저장 설정
# ========================================

# 모델 저장 디렉토리 - 학습된 모델과 결과를 저장할 폴더
# "250831_test": 날짜_용도 형식의 폴더명
save_dir: "250913_test"

# 실험 이름 - 실험을 구분하기 위한 이름
# null: 자동으로 "모델타입_타임스탬프" 형식으로 생성
exp_name: null

# ========================================
# 로깅 설정
# ========================================

# 로그 파일 이름 - 학습 과정을 기록할 파일
# "training.log": 학습 진행 상황, 손실, 메트릭 등 기록
log_file: "training.log"