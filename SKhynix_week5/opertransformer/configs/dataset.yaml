# ========================================
# 데이터 관련 설정
# ========================================

# Excel 파일 경로 - 학습에 사용할 원본 데이터 파일
file_path: "/home/doyoon/teaching/SKhynix_2025/PBL_TAT_Set_Data Rev2(사외).xlsx"

# 범주형 변수 컬럼 목록 - 카테고리로 처리할 특성들
# oper_group: 공정 그룹 (어떤 그룹에 속하는지)
# days: 요일 정보
# shift: 근무 교대 정보
# x1: 범주형 특성 변수 1
categorical_columns: ["oper_group", "days", "shift", "x1"]

# 연속형 변수 컬럼 목록 - 수치형으로 처리할 특성들
# x2~x21: 연속형 특성 변수 (공정 관련 측정값, 센서 데이터 등)
continuous_columns: ["x2", "x3", "x4", "x5", "x6", "x7", "x8", "x9", "x10", 
                     "x11", "x12", "x13", "x14", "x15", "x16", "x17", "x18", 
                     "x19", "x20", "x21"]

# 예측 대상 변수 - 모델이 예측하려는 목표값
target_column: "y"

# Excel 파일에서 읽을 시트 이름 목록
# 여러 시트의 데이터를 합쳐서 사용
sheet_names: ["Data_Set1(사외)", "Data_Set2(사외)"]

# 삭제할 추가 컬럼 목록 - 모델 학습에 불필요한 컬럼들
# lot_cd: 로트 코드 (개별 생산 단위 식별자)
# oper_area: 공정 구역 정보
additional_drop_columns: ["lot_cd", "oper_area"]

# ========================================
# 데이터 분할 설정
# ========================================

# 학습 데이터 비율 - 전체 데이터의 80%를 학습용으로 사용
train_ratio: 0.8

# 검증 데이터 비율 - 전체 데이터의 10%를 검증용으로 사용
# 학습 중 과적합 확인 및 하이퍼파라미터 튜닝에 사용
val_ratio: 0.1

# 테스트 데이터 비율 - 전체 데이터의 10%를 최종 평가용으로 사용
# 모델의 실제 성능을 평가하는 데 사용
test_ratio: 0.1

# ========================================
# 시퀀스 생성 관련 설정
# ========================================

# 슬라이딩 윈도우 크기 - 한 번에 보는 연속된 공정 수
# 50개의 연속된 공정을 하나의 윈도우로 묶어서 처리
window_size: 11

# 윈도우 이동 간격 - 다음 윈도우를 생성할 때 이동하는 간격
# 1: 한 칸씩 이동하며 모든 가능한 윈도우 생성 (최대 데이터 활용)
window_stride: 1

# 최대 시퀀스 길이 - 모델이 처리할 수 있는 최대 시퀀스 길이
# 윈도우 + 그룹 데이터의 최대 길이를 제한
max_sequence_length: 50

# 범주형 변수 임베딩 차원 - 각 범주형 변수를 몇 차원으로 임베딩할지
# 8차원: 범주를 8차원 벡터로 표현
embedding_dim: 8

# 패딩 값 - 시퀀스 길이를 맞추기 위해 빈 부분을 채우는 값
# 0.0: 중립적인 값으로 패딩
padding_value: -99

# 그룹 결정 기준 위치 - 윈도우 내에서 어느 위치를 기준으로 그룹을 선택할지
# "middle": 윈도우 중간 위치의 공정이 속한 그룹 선택
# 옵션: "first" (첫 번째), "middle" (중간), "last" (마지막)
group_position: "middle"

# ========================================
# 데이터 정규화 설정
# ========================================

scaler_type: "standard"  # "robust", "standard", "minmax" 중 선택
minmax_range: [0, 1]    # MinMaxScaler 사용 시 범위 지정
clip_outliers: false     # 극단값 클리핑 여부
normalize_target: false # 타겟 변수 정규화 여부

# ========================================
# 데이터로더 설정
# ========================================

# 배치 크기 - 한 번에 처리할 샘플 수
# 128: GPU 메모리와 학습 속도를 고려한 크기
batch_size: 128

# 데이터 로딩 워커 수 - 병렬로 데이터를 로드할 프로세스 수
# 0: 메인 프로세스에서 로드 (Windows에서 안정적)
# 리눅스에서는 4~8 권장
num_workers: 0